<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMEN — builder desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/lumen.css" />
  </head>
  <body>
    <div id="boot" class="boot">LUMEN — loading builder desk…</div>

    <div id="desk" class="desktop hidden">
      <div class="icons" id="icons"></div>
      <div class="windows" id="wins"></div>

      <footer class="taskbar">
        <button type="button" class="start" id="startBtn">LUMEN</button>
        <div class="tasks" id="tasks"></div>
        <div class="tray" id="clock"></div>
      </footer>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
