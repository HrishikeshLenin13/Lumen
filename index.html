<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LUMEN — offline builder desk for notes, focus timer, and ship log."
    />
    <meta name="theme-color" content="#245edb">
    <meta name="application-name" content="LUMEN">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LUMEN">
    <link rel="manifest" href="manifest.webmanifest?v=12">
    <link rel="icon" href="icons/favicon.png?v=12" type="image/png">
    <title>LUMEN — builder desk</title>

    <link rel="stylesheet" href="css/lumen-vintage.css?v=13" />
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite"><img class="boot-mark" src="icons/l.png?v=12" alt=""><span class="boot-logo">LUMEN</span><span class="boot-copy">Starting up...</span><span class="boot-track"><span></span></span></div>

    <main id="desk" class="desktop hidden">
      <nav class="icons" id="icons" aria-label="Applications"></nav>
      <div class="windows" id="wins" aria-live="polite"></div>

      <footer class="taskbar">
        <div class="start-wrap">
          <button
            type="button"
            class="start"
            id="startBtn"
            aria-label="Open LUMEN menu"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            LUMEN
          </button>
          <div class="start-menu hidden" id="startMenu" role="menu" aria-label="LUMEN menu"></div>
        </div>
        <div class="tasks" id="tasks" role="tablist" aria-label="Open windows"></div>
        <time class="tray" id="clock" aria-label="Current time"></time>
      </footer>

      <div class="toast hidden" id="toast" role="status" aria-live="assertive"></div>
    </main>

    <div class="smooth-cursor" id="smoothCursor" aria-hidden="true"></div>

    <script src="js/main.js?v=13"></script>
  </body>
</html>
